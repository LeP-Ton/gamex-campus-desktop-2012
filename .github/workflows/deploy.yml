name: 发布 GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - .agentdocs/**
      - docs/**
      - README.md
      - AGENTS.md
      - CLAUDE.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7.0.1
      - name: 设置 Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 验证游戏规则
        run: npm test
      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: 构建项目子路径版本
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
      - name: 上传网页产物
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v5.0.1
